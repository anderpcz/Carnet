<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f23">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Carnet Muscu</title>
<style>
:root{--bg:#e6e8e3;--card:#f6f7f4;--ink:#1b1f23;--mute:#6a7078;--line:#cfd2cb;--acc:#2447f5;--pr:#c98a00;--nav:#1b1f23;--btn:#1b1f23}
:root[data-theme=dark]{--bg:#121417;--card:#1c1f24;--ink:#e8eaed;--mute:#8d949c;--line:#2f343b;--acc:#4a6bff;--pr:#ffb020;--nav:#0a0b0d;--btn:#2a2f37;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{padding:16px 14px calc(150px + env(safe-area-inset-bottom));padding-top:calc(16px + env(safe-area-inset-top));max-width:560px;margin:auto}
h1{font-size:26px;margin:0 0 14px;letter-spacing:-.02em}
h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.mute{color:var(--mute);font-size:13px}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:var(--btn);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.acc{background:var(--acc);color:#fff}
button.x{background:none;color:var(--mute);padding:6px 10px;font-size:18px}
button.tpl{background:var(--card);color:var(--ink);border:1px solid var(--line);width:100%;text-align:left;margin-bottom:8px;display:flex;justify-content:space-between}
input{font:inherit;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px;min-width:0}
.set{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.pr{color:var(--pr);font-weight:700}
.hint{margin:6px 0 10px}
.adv{color:var(--acc);font-size:13px;font-weight:600;margin:-4px 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:16px 0;color:#9aa0a8}
nav button.on{color:#fff;box-shadow:inset 0 3px var(--acc)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(62px + env(safe-area-inset-bottom));background:var(--acc);color:#fff;border-radius:14px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;font-weight:700}
#rest.go{display:flex}
#rest button{background:rgba(255,255,255,.2);color:#fff;padding:8px 12px}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<main id="app"></main>
<div id="rest"><span id="rt"></span><span class="row"><button data-a="rest-">−5 s</button><button data-a="rest+">+5 s</button><button data-a="rest0">Stop</button></span></div>
<nav>
<button data-t="seance">Séance</button><button data-t="histo">Historique</button><button data-t="prog">Progrès</button><button data-t="set">Réglages</button>
</nav>
<script>
const KEY='carnet-muscu-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db||{templates:{Pull:[],Push:[],Legs:[]},sessions:[],active:null,rest:90};
const ACC={bleu:['#2447f5','#4a6bff'],rouge:['#d6402b','#ff5c47'],vert:['#1f8a4c','#3ecf7a'],orange:['#e07b00','#ff9a2e'],violet:['#7a3df0','#a47bff'],rose:['#d6338a','#ff5fb0']};
function applyTheme(){const t=db.theme==='light'||db.theme==='dark'?db.theme:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;document.documentElement.style.setProperty('--acc',(ACC[db.accent]||ACC.bleu)[t==='dark'?1:0]);document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0a0b0d':'#1b1f23'}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
const norm=()=>Object.keys(db.templates).forEach(k=>db.templates[k]=db.templates[k].map(x=>typeof x==='string'?{n:x,t:''}:x));
norm();
let tab='seance',progEx=null,tEnd=0,tick=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const fmt=n=>String(parseFloat(n));
const e1=(w,r)=>w*(1+r/30);
const fmtT=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),c=t%60,p=x=>String(x).padStart(2,'0');return h?h+':'+p(m)+':'+p(c):p(m)+':'+p(c)};
const fmtD=t=>{const h=Math.floor(t/3600),m=Math.floor(t%3600/60);return h?h+' h '+String(m).padStart(2,'0')+' min':m?m+' min':t+' s'};
const rng=t=>{const m=String(t||'').match(/(\d+)\s*[-–]\s*(\d+)/);if(m)return[+m[1],+m[2]];return/^\d+$/.test(String(t||'').trim())?[+t,+t]:null};
function advice(n,t){
  const L=lastSets(n);if(!L.length)return'';
  const W=Math.max(...L.map(s=>s.w)),top=L.filter(s=>s.w===W),mr=Math.min(...top.map(s=>s.r)),Mr=Math.max(...top.map(s=>s.r)),R=rng(t);
  const inc=W<20?1:W<100?2.5:5;
  if(W===0)return R?(mr>=R[1]?'Palier atteint : ajoute du poids (lest) ou vise '+(R[1]+1)+' reps':'Vise '+Math.min(R[1],mr+1)+' reps sur chaque série'):'Vise '+(Mr+1)+' reps (+1 rep)';
  if(R){const lo=R[0],hi=R[1];
    if(mr>=hi)return 'Palier atteint : passe à '+fmt(W+inc)+' kg (+'+fmt(inc)+' kg) et vise '+lo+' reps';
    if(mr<lo)return 'Garde '+fmt(W)+' kg et vise '+lo+' reps sur chaque série (tu étais à '+mr+')';
    return 'Garde '+fmt(W)+' kg et vise '+Math.min(hi,mr+1)+' reps sur chaque série (+1 rep)';}
  return '+1 rep : '+fmt(W)+' kg × '+(Mr+1)+', ou '+fmt(W+inc)+' kg (+'+fmt(inc)+') si c\'était facile';
}
const dt=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const allEx=()=>[...new Set(db.sessions.flatMap(s=>s.ex.map(e=>e.n)))].sort();
const lastSets=n=>{for(let i=db.sessions.length-1;i>=0;i--){const e=db.sessions[i].ex.find(x=>x.n===n);if(e&&e.sets.length)return e.sets}return[]};
const best=n=>{let m=0;db.sessions.forEach(s=>s.ex.forEach(e=>e.n===n&&e.sets.forEach(t=>m=Math.max(m,t.w))));return m};

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#app').innerHTML=({seance:vSeance,histo:vHisto,prog:vProg,set:vSet})[tab]();
}

function vSeance(){
  const a=db.active;
  if(!a){
    return `<h1>Séance</h1>`+Object.keys(db.templates).map(n=>`<button class="tpl" data-a="start" data-n="${esc(n)}"><span>${esc(n)}</span><span style="font-weight:400">${db.templates[n].length} exercice${db.templates[n].length>1?'s':''}</span></button>`).join('')
    +`<div class="row" style="margin-top:12px"><button class="sec" data-a="newtpl">Nouveau modèle</button></div>`;
  }
  return `<div class="row sp"><h1>${esc(a.name)}</h1><button class="x" data-a="cancel">Annuler</button></div>`
  +(a.started?`<div class="card row sp"><span class="mute">Durée de la séance</span><b id="tm" style="font-size:26px">${fmtT(Date.now()-a.started)}</b></div>`:`<button class="acc" style="width:100%;margin-bottom:12px" data-a="begin">Commencer la séance</button>`)
  +a.ex.map((e,i)=>{
    const last=lastSets(e.n),cur=e.sets.length?e.sets[e.sets.length-1]:last[last.length-1]||{w:'',r:''};
    return `<div class="card"><div class="row sp"><h2>${esc(e.n)}</h2><span class="row"><button class="sec" style="padding:6px 10px" data-a="target" data-i="${i}">${e.t?esc(e.t)+' reps':'+ reps'}</button><button class="x" data-a="delex" data-i="${i}">×</button></span></div>
    <div class="mute hint">${last.length?'Dernière fois : '+last.map(s=>fmt(s.w)+'×'+s.r).join(', '):'Première fois'}</div>${advice(e.n,e.t)?`<div class="adv">Conseil : ${esc(advice(e.n,e.t))}</div>`:''}`
    +e.sets.map((s,j)=>`<div class="set"><span>Série ${j+1}</span><span>${fmt(s.w)} kg × ${s.r}${s.w>best(e.n)?' <span class="pr">record</span>':''} <button class="x" data-a="delset" data-i="${i}" data-j="${j}">×</button></span></div>`).join('')
    +`<div class="row" style="margin-top:10px"><input id="w${i}" inputmode="decimal" placeholder="kg" value="${cur.w}"><input id="r${i}" inputmode="numeric" placeholder="reps" value="${cur.r}"><button class="acc" data-a="addset" data-i="${i}">Valider</button></div></div>`;
  }).join('')
  +`<div class="row"><input id="newex" placeholder="Ajouter un exercice"><button class="sec" data-a="addex">Ajouter</button></div>
  <div class="row" style="margin-top:16px"><button class="acc" style="flex:1" data-a="finish">Terminer la séance</button></div>`;
}

function vHisto(){
  if(!db.sessions.length)return `<h1>Historique</h1><div class="card mute">Aucune séance pour l'instant. Termine ta première séance pour la retrouver ici.</div>`;
  return `<h1>Historique</h1>`+[...db.sessions].reverse().map(s=>{
    const vol=s.ex.reduce((t,e)=>t+e.sets.reduce((u,x)=>u+x.w*x.r,0),0);
    return `<div class="card"><div class="row sp"><h2>${esc(s.name)}</h2><span class="mute">${dt(s.date)}</span></div>
    <div class="mute hint">${s.ex.reduce((t,e)=>t+e.sets.length,0)} séries · ${Math.round(vol)} kg de volume${s.dur?' · '+fmtD(s.dur):''}</div>`
    +s.ex.map(e=>`<div class="set"><span>${esc(e.n)}</span><span>${e.sets.map(x=>fmt(x.w)+'×'+x.r).join('  ')}</span></div>`).join('')
    +`<div style="margin-top:8px"><button class="x" data-a="delsess" data-id="${s.id}">Supprimer</button></div></div>`;
  }).join('');
}

function vProg(){
  const L=allEx();
  if(!L.length)return `<h1>Progrès</h1><div class="card mute">Les courbes apparaissent après ta première séance terminée.</div>`;
  if(!progEx||!L.includes(progEx))progEx=L[0];
  const pts=db.sessions.map(s=>{const e=s.ex.find(x=>x.n===progEx);if(!e||!e.sets.length)return null;const W=Math.max(...e.sets.map(x=>x.w));return{d:s.date,w:W,r:Math.max(...e.sets.filter(x=>x.w===W).map(x=>x.r))}}).filter(Boolean);
  let rm=0;db.sessions.forEach(s=>s.ex.forEach(e=>e.n===progEx&&e.sets.forEach(t=>rm=Math.max(rm,e1(t.w,t.r)))));
  const mx=Math.max(...pts.map(p=>p.w)),mn=Math.min(...pts.map(p=>p.w));
  const W=320,H=200,pl=42,pr=14,pt=24,pb=34,span=(mx-mn)||1,ylo=mn-span*.12,yhi=mx+span*.18;
  const X=i=>pts.length>1?pl+i*((W-pl-pr)/(pts.length-1)):pl+(W-pl-pr)/2;
  const Y=v=>pt+(1-(v-ylo)/(yhi-ylo))*(H-pt-pb);
  const sd=t=>new Date(t).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
  const step=Math.ceil(pts.length/7);
  const ticks=mn===mx?[mx]:[mn,(mn+mx)/2,mx];
  const grid=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-dasharray="3 3"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end" style="fill:var(--mute);font-size:10px">${fmt(Math.round(v*10)/10)}</text>`).join('');
  const line=pts.map((p,i)=>X(i)+','+Y(p.w)).join(' ');
  const dots=pts.map((p,i)=>{const lab=i%step===0||i===pts.length-1,top=p.w===mx;
    return `<circle cx="${X(i)}" cy="${Y(p.w)}" r="${top?5:3.5}" style="fill:${top?'var(--pr)':'var(--acc)'}"/>`
    +(lab?`<text x="${X(i)}" y="${Y(p.w)-9}" text-anchor="middle" style="fill:var(--ink);font-size:10px;font-weight:700">${fmt(p.w)}</text><text x="${X(i)}" y="${H-14}" text-anchor="middle" style="fill:var(--mute);font-size:10px">${sd(p.d)}</text>`:'')}).join('');
  return `<h1>Progrès</h1><div class="card"><select id="pe" style="width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">${L.map(n=>`<option${n===progEx?' selected':''}>${esc(n)}</option>`).join('')}</select>
  <div class="row sp" style="margin:14px 0 6px"><div><div class="mute">Record</div><b style="font-size:22px">${fmt(mx)} kg</b></div><div><div class="mute">1RM estimé</div><b style="font-size:22px">${Math.round(rm)} kg</b></div><div><div class="mute">Séances</div><b style="font-size:22px">${pts.length}</b></div></div>
  <svg viewBox="0 0 ${W} ${H}">${grid}<polyline fill="none" style="stroke:var(--acc)" stroke-width="2.5" stroke-linejoin="round" points="${line}"/>${dots}</svg>
  <div class="mute" style="margin-top:6px">Chaque point = une séance : la charge la plus lourde soulevée (kg), avec la date en dessous. Le point jaune est ton record.</div></div>
  <div class="card"><div class="mute hint">Dernières séances</div>${[...pts].reverse().slice(0,8).map(p=>`<div class="set"><span>${new Date(p.d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}</span><span>${fmt(p.w)} kg × ${p.r}</span></div>`).join('')}</div>`;
}

function vSet(){
  let L=0;try{L=(localStorage.getItem(KEY)||'').length}catch(e){}
  const sz=L<1024?L+' o':L<1048576?(L/1024).toFixed(1).replace('.',',')+' Ko':(L/1048576).toFixed(2).replace('.',',')+' Mo';
  const pc=Math.max(0.01,L/5000000*100).toFixed(2).replace('.',',');
  const nb=db.sessions.reduce((t,s)=>t+s.ex.reduce((u,e)=>u+e.sets.length,0),0);
  return `<h1>Réglages</h1><div class="card"><div class="mute hint">Thème</div><select id="th" style="width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><option value="auto"${!db.theme||db.theme==='auto'?' selected':''}>Auto (comme le téléphone)</option><option value="light"${db.theme==='light'?' selected':''}>Clair</option><option value="dark"${db.theme==='dark'?' selected':''}>Sombre</option></select><div class="mute hint" style="margin-top:14px">Couleur d'accent</div><div class="row" style="flex-wrap:wrap;gap:10px">${Object.keys(ACC).map(k=>`<button data-a="accent" data-c="${k}" aria-label="${k}" style="width:40px;height:40px;border-radius:50%;padding:0;background:${ACC[k][0]};border:3px solid ${(db.accent||'bleu')===k?'var(--ink)':'transparent'}"></button>`).join('')}</div></div><div class="card"><div class="mute hint">Temps de repos (secondes)</div><input id="rs" inputmode="numeric" value="${db.rest}"></div>
  <div class="card"><div class="mute hint">Stockage utilisé</div><div class="row sp"><b style="font-size:22px">${sz}</b><span class="mute">${db.sessions.length} séances · ${nb} séries</span></div><div class="mute" style="margin-top:6px">${pc} % de la limite d'environ 5 Mo</div></div>
  <div class="card"><div class="mute hint">Tes données restent sur ce téléphone. « Sauvegarder » ouvre le menu de partage : choisis Drive pour envoyer le fichier dans ton Drive.</div><div class="row"><button class="acc" style="flex:1" data-a="share">Sauvegarder (Drive…)</button></div><div class="row" style="margin-top:8px"><button class="sec" style="flex:1" data-a="export">Exporter</button><button class="sec" style="flex:1" data-a="import">Importer</button></div><input type="file" id="imp" hidden></div>
  <div class="card"><div class="mute hint">Modèles de séance</div>${Object.keys(db.templates).map(n=>`<div class="set"><span>${esc(n)}</span><span class="row"><button class="x" data-a="rentpl" data-n="${esc(n)}">Renommer</button><button class="x" data-a="deltpl" data-n="${esc(n)}">Supprimer</button></span></div>`).join('')}</div><div class="mute" style="text-align:center">Version 1.0.15</div>`;
}

function shareBackup(){
  const n='carnet-muscu-'+new Date().toISOString().slice(0,10)+'.json',txt=JSON.stringify(db);
  const dl=err=>{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=n;document.body.appendChild(l);l.click();l.remove();alert('Partage impossible ('+err+'). Le fichier a été téléchargé dans Téléchargements.')};
  if(!navigator.share){dl('non supporté');return}
  const f=new File([txt],n.replace('.json','.txt'),{type:'text/plain'});
  const data=navigator.canShare&&navigator.canShare({files:[f]})?{files:[f],title:'Sauvegarde Carnet Muscu'}:{title:'Sauvegarde Carnet Muscu',text:txt};
  navigator.share(data).catch(e=>{if(e&&e.name==='AbortError')return;dl((e&&e.name)+': '+(e&&e.message)+' / '+(data.files?'fichier':'texte'))});
}
function startRest(){tEnd=Date.now()+db.rest*1000;runRest()}
function runRest(){
  clearInterval(tick);const r=$('#rest');r.classList.add('go');
  const f=()=>{const l=Math.ceil((tEnd-Date.now())/1000);
    if(l<=0){$('#rt').textContent='Repos terminé';clearInterval(tick);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}setTimeout(()=>{if(Date.now()>=tEnd)r.classList.remove('go')},4000);return}
    $('#rt').textContent='Repos '+Math.floor(l/60)+':'+String(l%60).padStart(2,'0')};
  f();tick=setInterval(f,250);
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-t]');if(t){tab=t.dataset.t;render();return}
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=b.dataset,A=db.active;
  if(a==='rest0'){tEnd=0;clearInterval(tick);$('#rest').classList.remove('go');return}
  if(a==='rest+'){tEnd=Math.max(tEnd,Date.now())+5000;runRest();return}
  if(a==='rest-'){tEnd-=5000;runRest();return}
  if(a==='start'){db.active={name:d.n,date:Date.now(),ex:(db.templates[d.n]||[]).map(x=>({n:x.n,t:x.t||'',sets:[]}))}}
  else if(a==='newtpl'){const n=(prompt('Nom du modèle (ex. Push, Legs)')||'').trim();if(!n)return;db.templates[n]=db.templates[n]||[]}
  else if(a==='rentpl'){const n=(prompt('Nouveau nom du modèle',d.n)||'').trim();if(!n||n===d.n)return;if(db.templates[n]){alert('Ce nom existe déjà.');return}const o={};Object.keys(db.templates).forEach(k=>o[k===d.n?n:k]=db.templates[k]);db.templates=o;if(A&&A.name===d.n)A.name=n}
  else if(a==='deltpl'){if(!confirm('Supprimer le modèle '+d.n+' ?'))return;delete db.templates[d.n]}
  else if(a==='accent'){db.accent=d.c;applyTheme()}
  else if(a==='begin'){A.started=Date.now()}
  else if(a==='cancel'){if(!confirm('Annuler cette séance ?'))return;db.active=null}
  else if(a==='addex'){const n=$('#newex').value.trim();if(!n)return;A.ex.push({n,sets:[]})}
  else if(a==='target'){const v=prompt('Fourchette de reps (ex. 8-10 ou 1-3). Laisse vide pour enlever.',A.ex[+d.i].t||'');if(v===null)return;A.ex[+d.i].t=v.trim().slice(0,12)}
  else if(a==='delex'){if(!confirm('Retirer cet exercice ?'))return;A.ex.splice(+d.i,1)}
  else if(a==='addset'){const w=parseFloat(($('#w'+d.i).value||'').replace(',','.')),r=parseInt($('#r'+d.i).value);
    if(isNaN(w)||isNaN(r)||r<1){alert('Entre un poids et un nombre de reps.');return}
    A.ex[+d.i].sets.push({w,r});startRest()}
  else if(a==='delset'){A.ex[+d.i].sets.splice(+d.j,1)}
  else if(a==='finish'){
    const ex=A.ex.filter(e=>e.sets.length);
    if(!ex.length){if(!confirm('Aucune série saisie. Quitter sans enregistrer ?'))return;db.active=null}
    else{db.sessions.push({id:Date.now(),date:A.started||A.date,name:A.name,dur:A.started?Math.round((Date.now()-A.started)/1000):0,ex});if(A.name!=='Séance libre')db.templates[A.name]=A.ex.map(e=>({n:e.n,t:e.t||''}));db.active=null;tab='histo'}
    tEnd=0;clearInterval(tick);$('#rest').classList.remove('go')}
  else if(a==='delsess'){if(!confirm('Supprimer cette séance ?'))return;db.sessions=db.sessions.filter(s=>s.id!==+d.id)}
  else if(a==='share'){shareBackup();return}
  else if(a==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='carnet-muscu-'+new Date().toISOString().slice(0,10)+'.json';l.click();return}
  else if(a==='import'){$('#imp').click();return}
  save();render();
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='pe'){progEx=ev.target.value;render()}
  if(ev.target.id==='th'){db.theme=ev.target.value;save();applyTheme()}
  if(ev.target.id==='rs'){const v=parseInt(ev.target.value);if(v>0){db.rest=v;save()}}
  if(ev.target.id==='imp'){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{const n=JSON.parse(t);if(!n.sessions||!n.templates)throw 0;if(!confirm('Remplacer les données actuelles ?'))return;db=n;norm();save();render()}catch(e){alert('Fichier invalide.')}})}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{const e=$('#tm');if(e&&db.active&&db.active.started)e.textContent=fmtT(Date.now()-db.active.started)},1000);
applyTheme();render();
</script>
</body>
</html>
